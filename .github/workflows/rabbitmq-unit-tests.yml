name: Shared-library unit tests

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'libs/nest/**'
      - 'package.json'
      - 'yarn.lock'
      - 'jest.preset.js'
      - '.yarnrc.yml'
      - '.yarn/releases/**'
      - '.github/workflows/rabbitmq-unit-tests.yml'
  pull_request:
    paths:
      - 'libs/nest/**'
      - 'package.json'
      - 'yarn.lock'
      - 'jest.preset.js'
      - '.yarnrc.yml'
      - '.yarn/releases/**'
      - '.github/workflows/rabbitmq-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-library-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: RabbitMQ regression tests
            test-args: --runTestsByPath libs/nest/src/lib/rabbit/rabbit.service.spec.ts
          - suite: Shared-library suite
            test-args: ''
          - suite: Shared-library baseline
            baseline: true
            test-args: ''
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cold_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cold_shadow_test
      DD_SERVICE: cold-api
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Compare the untouched starting revision using exactly the same job.
          ref: ${{ matrix.baseline && '3940630f6b5acf855511d6faaa6f849138e2de00' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.4.1.cjs install --immutable
      - name: Generate Prisma models
        run: node .yarn/releases/yarn-4.4.1.cjs prisma generate --schema libs/nest/prisma/schema.prisma
      - name: Run unit tests
        run: node .yarn/releases/yarn-4.4.1.cjs jest --config libs/nest/jest.config.ts --runInBand --ci --forceExit ${{ matrix.test-args }}
