name: RabbitMQ regression tests

on:
  push:
    branches:
      - main
      - staging
      - 'fix/**'
    paths:
      - 'libs/nest/**'
      - 'package.json'
      - 'yarn.lock'
      - 'jest.preset.js'
      - '.yarnrc.yml'
      - '.yarn/releases/**'
      - '.github/workflows/rabbitmq-unit-tests.yml'
  pull_request:
    paths:
      - 'libs/nest/**'
      - 'package.json'
      - 'yarn.lock'
      - 'jest.preset.js'
      - '.yarnrc.yml'
      - '.yarn/releases/**'
      - '.github/workflows/rabbitmq-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rabbitmq-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RabbitMQ regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cold_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cold_shadow_test
      DD_SERVICE: cold-api
      DD_TRACE_ENABLED: 'false'
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.4.1.cjs install --immutable
      - name: Generate Prisma models
        run: node .yarn/releases/yarn-4.4.1.cjs prisma generate --schema libs/nest/prisma/schema.prisma
      - name: Run unit tests
        run: node .yarn/releases/yarn-4.4.1.cjs jest --config libs/nest/jest.config.ts --runInBand --ci --detectOpenHandles --runTestsByPath libs/nest/src/lib/rabbit/rabbit.service.spec.ts
