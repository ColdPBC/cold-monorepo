name: Storybook UI tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-ui-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-ui-tests:
    name: storybook-ui-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      STORYBOOK_DISABLE_TELEMETRY: '1'
      STORYBOOK_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      STORYBOOK_API_URL: http://127.0.0.1:4400
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install immutable dependencies without lifecycle scripts
        run: node .yarn/releases/yarn-4.4.1.cjs install --immutable --mode=skip-build
      # The hosted Ubuntu24 image already provides Chromium libraries and base fonts.
      # Browser smoke tests below validate them without optional apt font downloads.
      - name: Install locked Chromium browser
        run: node "$(node -p "require('path').join(require('path').dirname(require.resolve('playwright/package.json', {paths:[require.resolve('@storybook/test-runner')]})), 'cli.js')")" install chromium
      - name: Verify browser network isolation
        run: node --test tools/storybook/isolation.test.cjs
      - name: Verify result gate regressions
        run: node --test tools/storybook/results.test.cjs tools/storybook/presets.test.cjs tools/storybook/offline-fonts.test.cjs
      - name: Generate source barrels with the locked tool
        run: node .yarn/releases/yarn-4.4.1.cjs exec barrelsby -D -l all --directory ./libs/react/src -e stories.tsx -e react-app-env -e private.tsx -e spec.ts -S -H
      - name: Build all Storybook stories locally
        run: node .yarn/releases/yarn-4.4.1.cjs exec storybook build --config-dir apps/cold-ui/.storybook --output-dir dist/storybook/cold-ui --disable-telemetry
      - name: Run all Storybook render and interaction tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4400 --bind 127.0.0.1 --directory dist/storybook/cold-ui > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4400/index.json > /dev/null
          node --test tools/storybook/startup.test.cjs
          node .yarn/releases/yarn-4.4.1.cjs exec test-storybook --config-dir apps/cold-ui/.storybook --url http://127.0.0.1:4400 --browsers chromium --index-json --maxWorkers 2 --ci --json --outputFile "$RUNNER_TEMP/storybook-results.json"
          node tools/storybook/verify-results.cjs "$RUNNER_TEMP/storybook-results.json" dist/storybook/cold-ui/index.json
