name: Deployment safety

on:
  push:
    branches: ['fix/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-flightcontrol-deploys:
    name: No Flightcontrol deployments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Verify deployment safety and manual E2E configuration
        run: python -m unittest discover -s tools/ci -p 'test_*.py' -v
