name: Manual API E2E Tests
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Explicit API server URL to test. This workflow does not deploy an application.'
        type: string
        required: true

permissions:
  contents: read

env:
  API_SERVER_URL: ${{ inputs.api_url }}
  API_ADMIN_EMAIL: ${{ secrets.API_ADMIN_EMAIL }}
  API_ADMIN_PASSWORD: ${{ secrets.TEST_API_ADMIN_PASSWORD }}
  AUTH0_AUDIENCE: ${{ secrets.TEST_AUTH0_AUDIENCE }}
  AUTH0_CLIENT_ID: ${{ secrets.TEST_AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.TEST_AUTH0_CLIENT_SECRET }}
  AUTH0_ORG_ID: ${{ secrets.TEST_AUTH0_ORG_ID }}
  AUTH0_TOKEN_URL: ${{ secrets.TEST_AUTH0_TOKEN_URL }}
  DD_SITE: us5.datadoghq.com
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_CIVISIBILITY_AGENTLESS_ENABLED: true
  DD_ENV: test
  DD_SERVICE: cold-api-e2e

jobs:
  api-e2e:
    name: API E2E tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Prisma Client
        run: yarn nx run cold-nest-library:prisma-generate
      - name: Build development API
        run: yarn prebuild && yarn nx run cold-api:build:development
      - name: Run API E2E tests
        run: yarn nx run cold-api-e2e:e2e:ci
