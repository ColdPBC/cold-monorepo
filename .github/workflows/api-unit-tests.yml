name: API unit tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
      DD_SERVICE: cold-api
      DD_TRACE_ENABLED: false
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: false
      PUPPETEER_SKIP_DOWNLOAD: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cold_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cold_test_shadow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        id: dependencies
        run: node .yarn/releases/yarn-4.4.1.cjs install --immutable
      - name: Generate Prisma types
        id: prisma
        run: node .yarn/releases/yarn-4.4.1.cjs prisma generate --schema libs/nest/prisma/schema.prisma
      - name: Verify installed upload type declarations
        run: node -p "require.resolve('@types/multer/package.json')"
      - name: Run full API unit suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.prisma.outcome == 'success' }}
        run: node .yarn/releases/yarn-4.4.1.cjs jest --config apps/cold-api/jest.config.ts --runInBand --ci
